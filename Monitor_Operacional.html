<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Operacional — Tempo Real</title>
  <meta name="theme-color" content="#060b16" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060b16; --panel: #0c1424; --panel-2: #111b2e;
      --border: rgba(148,163,184,.14); --text: #e8eef7; --muted: #8b9bb4;
      --cyan: #22d3ee; --green: #34d399; --yellow: #fbbf24; --red: #f87171; --violet: #a78bfa;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,.08), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(99,102,241,.07), transparent 45%),
        var(--bg);
      color: var(--text); font-family: var(--font); overflow: hidden;
    }
    .shell {
      height: 100vh; display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 14px 18px 10px; gap: 10px;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: rgba(12,20,36,.9); border: 1px solid var(--border);
      border-radius: 16px; padding: 12px 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(34,211,238,.25), rgba(99,102,241,.25));
      border: 1px solid rgba(34,211,238,.3);
      display: grid; place-items: center; font-size: 1.1rem;
    }
    .brand h1 { font-size: 1.05rem; font-weight: 700; }
    .brand span { display: block; font-size: .75rem; color: var(--muted); }
    .kpis { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; flex: 1; }
    .kpi {
      min-width: 84px; background: var(--panel-2); border: 1px solid var(--border);
      border-radius: 12px; padding: 8px 12px; text-align: center;
    }
    .kpi strong { display: block; font-family: var(--mono); font-size: 1.3rem; font-weight: 600; }
    .kpi em { font-style: normal; font-size: .65rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .kpi.rota strong { color: var(--yellow); }
    .kpi.ok strong { color: var(--green); }
    .kpi.fail strong { color: var(--red); }
    .kpi.wait strong { color: #94a3b8; }
    .kpi.total strong { color: var(--cyan); }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(52,211,153,.1); border: 1px solid rgba(52,211,153,.28);
      color: var(--green); font-size: .7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; padding: 7px 12px; border-radius: 999px;
    }
    .live-pill.off { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.28); color: var(--red); }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: currentColor;
      box-shadow: 0 0 0 0 rgba(52,211,153,.55); animation: pulse 1.6s infinite;
    }
    .live-pill.off .live-dot { animation: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); }
      70% { box-shadow: 0 0 0 10px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    .icon-btn {
      height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text); font-size: .8rem; font-weight: 600; cursor: pointer;
    }
    .icon-btn:hover { border-color: rgba(34,211,238,.35); }
    .icon-btn.muted-on { color: var(--red); border-color: rgba(248,113,113,.35); }
    .clock { font-family: var(--mono); font-size: 1rem; font-weight: 600; color: var(--cyan); min-width: 80px; text-align: right; }
    .loading-line { height: 2px; background: transparent; overflow: hidden; border-radius: 2px; }
    .loading-line.active::after {
      content: ""; display: block; height: 100%; width: 30%;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: scan 1.2s linear infinite;
    }
    @keyframes scan { from { transform: translateX(-100%); } to { transform: translateX(400%); } }
    .board {
      overflow: auto; display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px; align-content: start; min-height: 0; height: 100%; padding-right: 4px;
    }
    .board::-webkit-scrollbar { width: 8px; }
    .board::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 8px; }
    .tech-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      display: flex; flex-direction: column; min-height: 200px; overflow: hidden;
    }
    .tech-card.has-rota {
      border-color: rgba(251,191,36,.45);
      box-shadow: 0 0 0 1px rgba(251,191,36,.12), 0 12px 32px rgba(251,191,36,.06);
    }
    .tech-card.flash-rota { animation: flashRota 1.1s ease; }
    .tech-card.flash-ok { animation: flashOk 1.1s ease; }
    .tech-card.flash-fail { animation: flashFail 1.1s ease; }
    @keyframes flashRota { 30% { box-shadow: 0 0 0 3px rgba(251,191,36,.55), 0 0 28px rgba(251,191,36,.25); } }
    @keyframes flashOk { 30% { box-shadow: 0 0 0 3px rgba(52,211,153,.55), 0 0 28px rgba(52,211,153,.25); } }
    @keyframes flashFail { 30% { box-shadow: 0 0 0 3px rgba(248,113,113,.55), 0 0 28px rgba(248,113,113,.25); } }
    .tech-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
    }
    .tech-name { font-size: .98rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .avatar {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(167,139,250,.18); color: var(--violet);
      display: grid; place-items: center; font-size: .75rem; font-weight: 800;
    }
    .tech-badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .mini {
      font-size: .68rem; font-weight: 700; padding: 3px 7px; border-radius: 999px; font-family: var(--mono);
    }
    .mini.rota { background: rgba(251,191,36,.15); color: var(--yellow); }
    .mini.ok { background: rgba(52,211,153,.15); color: var(--green); }
    .mini.fail { background: rgba(248,113,113,.15); color: var(--red); }
    .mini.wait { background: rgba(100,116,139,.18); color: #94a3b8; }
    .tech-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow: auto; max-height: 420px; }
    .os-row {
      border: 1px solid var(--border); border-radius: 11px; padding: 10px 11px;
      background: rgba(0,0,0,.18); border-left: 3px solid #64748b;
    }
    .os-row.rota { border-left-color: var(--yellow); background: rgba(251,191,36,.06); }
    .os-row.concluido { border-left-color: var(--green); }
    .os-row.nao-concluido { border-left-color: var(--red); }
    .os-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .os-status { font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .os-row.rota .os-status { color: var(--yellow); }
    .os-row.concluido .os-status { color: var(--green); }
    .os-row.nao-concluido .os-status { color: var(--red); }
    .os-row.aguardando .os-status { color: #94a3b8; }
    .os-time { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-weight: 600; }
    .os-client { font-size: .9rem; font-weight: 700; line-height: 1.25; margin-bottom: 2px; }
    .os-meta { font-size: .75rem; color: var(--muted); line-height: 1.35; }
    .os-obs { margin-top: 6px; font-size: .75rem; color: #fca5a5; font-style: italic; background: rgba(248,113,113,.06); border-radius: 6px; padding: 5px 8px; }
    .os-obs.ok-obs { color: #6ee7b7; background: rgba(52,211,153,.06); }
    .empty-tech { color: var(--muted); font-size: .85rem; text-align: center; padding: 28px 12px; }
    .footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: .75rem; color: var(--muted); padding: 2px 4px; flex-wrap: wrap;
    }
    .feed { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; min-width: 0; }
    .feed-item {
      background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 10px; font-size: .72rem; color: var(--text);
      white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis;
    }
    .feed-item.rota { border-color: rgba(251,191,36,.35); color: var(--yellow); }
    .feed-item.ok { border-color: rgba(52,211,153,.35); color: var(--green); }
    .feed-item.fail { border-color: rgba(248,113,113,.35); color: var(--red); }
    .toast-stack { position: fixed; top: 18px; right: 18px; z-index: 50; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast {
      background: rgba(12,20,36,.95); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; min-width: 260px; max-width: 380px;
      box-shadow: 0 16px 40px rgba(0,0,0,.4); animation: toastIn .35s ease;
    }
    .toast.rota { border-left: 3px solid var(--yellow); }
    .toast.ok { border-left: 3px solid var(--green); }
    .toast.fail { border-left: 3px solid var(--red); }
    .toast strong { display: block; font-size: .85rem; margin-bottom: 2px; }
    .toast span { font-size: .78rem; color: var(--muted); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
    .erro-box {
      grid-column: 1 / -1; max-width: 640px; margin: 40px auto; text-align: left;
      background: var(--panel); border: 1px solid rgba(248,113,113,.3); border-radius: 14px; padding: 20px;
    }
    .erro-box h2 { color: var(--red); font-size: 1.05rem; margin-bottom: 8px; }
    .erro-box p { color: var(--muted); font-size: .85rem; line-height: 1.5; margin-bottom: 8px; word-break: break-word; }
    .erro-box code { color: #e2e8f0; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">📡</div>
        <div>
          <h1>Monitor Operacional</h1>
          <span id="subBrand">Iniciando…</span>
        </div>
      </div>
      <div class="kpis">
        <div class="kpi total"><strong id="kpiTotal">0</strong><em>O.S. total</em></div>
        <div class="kpi rota"><strong id="kpiRota">0</strong><em>Em rota</em></div>
        <div class="kpi ok"><strong id="kpiOk">0</strong><em>Concluídas</em></div>
        <div class="kpi fail"><strong id="kpiFail">0</strong><em>Não concl.</em></div>
        <div class="kpi wait"><strong id="kpiWait">0</strong><em>Pendentes</em></div>
      </div>
      <div class="top-actions">
        <div class="live-pill off" id="livePill"><span class="live-dot"></span> Offline</div>
        <button class="icon-btn" id="btnSom" type="button">🔊 Sons</button>
        <button class="icon-btn" id="btnSync" type="button">↻ Sync</button>
        <div class="clock" id="relogio">--:--:--</div>
      </div>
    </header>
    <div class="loading-line active" id="loadingLine"></div>
    <main class="board" id="board">
      <div class="empty-tech" style="grid-column:1/-1;padding:48px;">Carregando dados da operação…</div>
    </main>
    <footer class="footer">
      <div class="feed" id="feed"></div>
      <div id="footerMeta">Aguardando primeira sincronização</div>
    </footer>
  </div>
  <div class="toast-stack" id="toastStack"></div>

  <script>
  (function () {
    const API_DIRECT = "https://68f458d8b16eb6f46834542c.mockapi.io/Rexord/Galeria";
    const API_PROXY = "/api/galeria";
    const POLL_MS = 6000;

    let somAtivo = true;
    let audioCtx = null;
    let snapshotAnterior = {};
    let primeiroSync = true;
    let pollTimer = null;
    let feedItens = [];
    let ultimoEndpointOk = "";
    let syncEmAndamento = false;

    function $(id) { return document.getElementById(id); }

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function atualizarRelogio() {
      $("relogio").textContent = new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }

    function garantirAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function tocarBeep(tipo) {
      if (!somAtivo) return;
      try {
        garantirAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (tipo === "rota") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          osc.start(now); osc.stop(now + 0.3);
        } else if (tipo === "ok") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          osc.start(now); osc.stop(now + 0.36);
        } else if (tipo === "fail") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.25);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
          osc.start(now); osc.stop(now + 0.42);
        }
      } catch (e) {}
    }

    function parsearAgenda(texto) {
      if (!texto || !String(texto).trim()) return [];
      var raw = String(texto);
      var temId = /\bID\s*:\s*\d+/i.test(raw);
      var temOS = /\bOS\s*:\s*\d+/i.test(raw);

      if (!temId && temOS) {
        var marcador = /OS\s*:\s*(\d+)/gi;
        var posicoes = [];
        var m;
        while ((m = marcador.exec(raw)) !== null) {
          posicoes.push({ id: m[1], inicio: m.index, fimMarcador: m.index + m[0].length });
        }
        return posicoes.map(function (atual, i) {
          var proximo = posicoes[i + 1];
          var fimBloco = proximo ? proximo.inicio : raw.length;
          var corpo = raw.slice(atual.fimMarcador, fimBloco);
          var inicioTrecho = i === 0 ? 0 : posicoes[i - 1].fimMarcador;
          var trechoAntes = raw.slice(inicioTrecho, atual.inicio);
          var hm = trechoAntes.match(/(\d{1,2}h\d{2})\s*(?:às|as|-|até)\s*(\d{1,2}h\d{2})/i);
          var clienteM = corpo.match(/Cliente:\s*(.*)/i);
          var endM = corpo.match(/(?:📍\s*)?Endereço:\s*(.*)/i);
          var servM = corpo.match(/Serviço:\s*(.*)/i);
          return {
            id: atual.id,
            cliente: (clienteM && clienteM[1] ? clienteM[1].trim() : "Cliente não informado"),
            horario: hm ? (hm[1].replace("h", ":") + " - " + hm[2].replace("h", ":")) : "",
            endereco: endM && endM[1] ? endM[1].trim() : "",
            assunto: servM && servM[1] ? servM[1].trim() : "Sem assunto"
          };
        });
      }

      return raw.split(/\bID\s*:\s*/i).slice(1).map(function (bloco) {
        var idM = bloco.match(/^(\d+)/);
        var id = idM ? idM[1] : "";
        var clienteM = bloco.match(/Cliente:\s*(.*)/i);
        var horM = bloco.match(/Horário:\s*(.*)/i);
        var endM = bloco.match(/Endereço:\s*(.*)/i);
        var assM = bloco.match(/Assunto:\s*(.*)/i);
        return {
          id: id,
          cliente: clienteM && clienteM[1] ? clienteM[1].trim() : "Cliente não informado",
          horario: horM && horM[1] ? horM[1].trim() : "",
          endereco: endM && endM[1] ? endM[1].trim() : "",
          assunto: assM && assM[1] ? assM[1].trim() : "Sem assunto"
        };
      }).filter(function (os) { return os.id; });
    }

    function normalizarStatus(info) {
      if (!info) return { status: "", obs: "", timestamp: "" };
      if (typeof info === "object") {
        return {
          status: info.status || "",
          obs: info.obs || "",
          timestamp: info.timestamp || ""
        };
      }
      return { status: String(info), obs: "", timestamp: "" };
    }

    function labelStatus(st) {
      if (st === "rota") return "Em rota";
      if (st === "concluido") return "Concluído";
      if (st === "nao-concluido") return "Não concluído";
      return "Pendente";
    }

    function pushFeed(texto, tipo) {
      feedItens.unshift({ texto: texto, tipo: tipo });
      feedItens = feedItens.slice(0, 6);
      $("feed").innerHTML = feedItens.map(function (f) {
        var cls = f.tipo === "rota" ? "rota" : f.tipo === "concluido" ? "ok" : f.tipo === "nao-concluido" ? "fail" : "";
        return '<span class="feed-item ' + cls + '">' + escapeHtml(f.texto) + '</span>';
      }).join("");
    }

    function showToast(titulo, detalhe, tipo) {
      var stack = $("toastStack");
      var div = document.createElement("div");
      var cls = tipo === "rota" ? "rota" : tipo === "concluido" ? "ok" : tipo === "nao-concluido" ? "fail" : "";
      div.className = "toast " + cls;
      div.innerHTML = "<strong>" + escapeHtml(titulo) + "</strong><span>" + escapeHtml(detalhe) + "</span>";
      stack.appendChild(div);
      setTimeout(function () { if (div.parentNode) div.parentNode.removeChild(div); }, 4500);
    }

    function endpointsCandidatos() {
      var lista = [];
      if (location.protocol === "http:" || location.protocol === "https:") {
        lista.push(API_PROXY);
      }
      lista.push(API_DIRECT);
      if (ultimoEndpointOk) {
        return [ultimoEndpointOk].concat(lista.filter(function (u) { return u !== ultimoEndpointOk; }));
      }
      return lista;
    }

    function buscarDadosAPI() {
      var erros = [];
      var bases = endpointsCandidatos();

      function tentar(i) {
        if (i >= bases.length) {
          return Promise.reject(new Error(erros.join(" | ") || "Falha ao buscar dados"));
        }
        var base = bases[i];
        var url = base + (base.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
        return fetch(url, { method: "GET", cache: "no-store" })
          .then(function (resp) {
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            return resp.json();
          })
          .then(function (dados) {
            if (!Array.isArray(dados)) throw new Error("JSON inválido");
            ultimoEndpointOk = base;
            return { dados: dados, endpoint: base };
          })
          .catch(function (err) {
            erros.push(base + " → " + (err && err.message ? err.message : String(err)));
            return tentar(i + 1);
          });
      }

      return tentar(0);
    }

    function processarDados(dados) {
      var tecnicos = [];
      var seen = {};
      dados.forEach(function (d) {
        if (d && d.tecnico && !seen[d.tecnico]) {
          seen[d.tecnico] = true;
          tecnicos.push(d.tecnico);
        }
      });
      tecnicos.sort(function (a, b) { return a.localeCompare(b, "pt-BR"); });

      $("subBrand").textContent = tecnicos.length + " técnico" + (tecnicos.length === 1 ? "" : "s") + " em campo · tempo real";

      var total = 0, rota = 0, ok = 0, fail = 0, wait = 0;
      var mudancas = [];
      var novoSnapshot = {};
      var boardHtml = [];

      tecnicos.forEach(function (tec) {
        var registro = null;
        for (var i = 0; i < dados.length; i++) {
          if (dados[i].tecnico === tec) { registro = dados[i]; break; }
        }
        if (!registro) registro = {};

        var listaOS = parsearAgenda(registro.agenda || "");
        var statusMap = {};
        try { statusMap = JSON.parse(registro.status || "{}"); } catch (e) { statusMap = {}; }

        var cRota = 0, cOk = 0, cFail = 0, cWait = 0;
        var rows = [];

        listaOS.forEach(function (os) {
          var info = normalizarStatus(statusMap[os.id]);
          var st = info.status;
          if (st !== "rota" && st !== "concluido" && st !== "nao-concluido") st = "aguardando";

          var chave = tec + "|" + os.id;
          novoSnapshot[chave] = st;
          var anterior = snapshotAnterior[chave];
          if (!primeiroSync && anterior !== undefined && anterior !== st) {
            mudancas.push({ tec: tec, os: os, para: st, info: info });
          }

          if (st === "rota") cRota++;
          else if (st === "concluido") cOk++;
          else if (st === "nao-concluido") cFail++;
          else cWait++;

          var hora = "";
          if (info.timestamp && info.timestamp !== "--:--") {
            var hm = String(info.timestamp).match(/\d{1,2}:\d{2}/);
            hora = hm ? hm[0] : String(info.timestamp);
          }
          var obsHtml = info.obs
            ? '<div class="os-obs ' + (st === "concluido" ? "ok-obs" : "") + '">' + escapeHtml(info.obs) + "</div>"
            : "";

          rows.push(
            '<div class="os-row ' + st + '">' +
              '<div class="os-top">' +
                '<span class="os-status">' + labelStatus(st) + "</span>" +
                '<span class="os-time">' + escapeHtml(hora || os.horario || "—") + "</span>" +
              "</div>" +
              '<div class="os-client">' + escapeHtml(os.cliente) + "</div>" +
              '<div class="os-meta">OS ' + escapeHtml(os.id) + " · " + escapeHtml(os.assunto) +
                (os.endereco ? " · " + escapeHtml(String(os.endereco).replace(/\s+/g, " ").slice(0, 60)) : "") +
              "</div>" +
              obsHtml +
            "</div>"
          );
        });

        total += listaOS.length;
        rota += cRota; ok += cOk; fail += cFail; wait += cWait;

        var badges = [];
        if (cRota) badges.push('<span class="mini rota">' + cRota + " rota</span>");
        if (cOk) badges.push('<span class="mini ok">' + cOk + " ok</span>");
        if (cFail) badges.push('<span class="mini fail">' + cFail + " falha</span>");
        if (cWait) badges.push('<span class="mini wait">' + cWait + " pend.</span>");

        var cardId = "card-" + String(tec).replace(/[^a-zA-Z0-9_-]/g, "_");
        boardHtml.push(
          '<article class="tech-card ' + (cRota ? "has-rota" : "") + '" id="' + cardId + '">' +
            '<div class="tech-head">' +
              '<div class="tech-name"><span class="avatar">' + escapeHtml((tec || "?").charAt(0).toUpperCase()) + "</span><span>" + escapeHtml(tec) + "</span></div>" +
              '<div class="tech-badges">' + (badges.join("") || '<span class="mini wait">sem O.S.</span>') + "</div>" +
            "</div>" +
            '<div class="tech-body">' +
              (rows.length ? rows.join("") : '<div class="empty-tech">Nenhuma O.S. na agenda</div>') +
            "</div>" +
          "</article>"
        );
      });

      $("kpiTotal").textContent = String(total);
      $("kpiRota").textContent = String(rota);
      $("kpiOk").textContent = String(ok);
      $("kpiFail").textContent = String(fail);
      $("kpiWait").textContent = String(wait);

      if (!tecnicos.length) {
        $("board").innerHTML = '<div class="empty-tech" style="grid-column:1/-1;padding:60px;">Nenhum técnico cadastrado na API.</div>';
      } else {
        $("board").innerHTML = boardHtml.join("");
      }

      mudancas.forEach(function (m) {
        var tipoSom = m.para === "rota" ? "rota" : m.para === "concluido" ? "ok" : m.para === "nao-concluido" ? "fail" : "ok";
        tocarBeep(tipoSom);
        pushFeed(m.tec + ": " + labelStatus(m.para) + " — " + m.os.cliente, m.para);
        showToast(labelStatus(m.para) + " · " + m.tec, "OS " + m.os.id + " · " + m.os.cliente, m.para);
        var card = document.getElementById("card-" + String(m.tec).replace(/[^a-zA-Z0-9_-]/g, "_"));
        if (card) {
          var flash = m.para === "rota" ? "flash-rota" : m.para === "concluido" ? "flash-ok" : "flash-fail";
          card.classList.add(flash);
          setTimeout(function () { card.classList.remove(flash); }, 1200);
        }
      });

      snapshotAnterior = novoSnapshot;
      primeiroSync = false;
    }

    function mostrarErro(msg) {
      $("livePill").className = "live-pill off";
      $("livePill").innerHTML = '<span class="live-dot"></span> Offline';
      $("footerMeta").textContent = "Erro de conexão";
      $("board").innerHTML =
        '<div class="erro-box">' +
          "<h2>Não foi possível carregar os dados</h2>" +
          "<p>" + escapeHtml(msg) + "</p>" +
          "<p>Teste no navegador: <code>/api/galeria</code> e clique em <strong>Sync</strong>.</p>" +
        "</div>";
    }

    function sync() {
      if (syncEmAndamento) return;
      syncEmAndamento = true;
      $("loadingLine").classList.add("active");
      buscarDadosAPI()
        .then(function (result) {
          try {
            if (!result.dados.length) {
              $("board").innerHTML = '<div class="empty-tech" style="grid-column:1/-1;padding:48px;">API sem técnicos cadastrados.</div>';
            } else {
              processarDados(result.dados);
            }
            $("livePill").className = "live-pill";
            $("livePill").innerHTML = '<span class="live-dot"></span> Ao vivo';
            var via = result.endpoint === API_PROXY ? "proxy" : "direto";
            $("footerMeta").textContent =
              "Última sync " + new Date().toLocaleTimeString("pt-BR") +
              " · " + result.dados.length + " registro(s) · via " + via +
              " · poll " + (POLL_MS / 1000) + "s";
          } catch (err) {
            console.error(err);
            mostrarErro("Erro ao processar dados: " + (err && err.message ? err.message : String(err)));
          }
        })
        .catch(function (err) {
          console.error(err);
          if (primeiroSync || !$("board").querySelector(".tech-card")) {
            mostrarErro(err && err.message ? err.message : String(err));
          }
        })
        .then(function () {
          syncEmAndamento = false;
          $("loadingLine").classList.remove("active");
        });
    }

    // Eventos
    $("btnSom").addEventListener("click", function () {
      somAtivo = !somAtivo;
      this.textContent = somAtivo ? "🔊 Sons" : "🔇 Mudo";
      this.classList.toggle("muted-on", !somAtivo);
      if (somAtivo) { garantirAudio(); tocarBeep("ok"); }
    });
    $("btnSync").addEventListener("click", function () {
      garantirAudio();
      sync();
    });

    // Boot
    atualizarRelogio();
    setInterval(atualizarRelogio, 1000);
    sync();
    pollTimer = setInterval(sync, POLL_MS);
  })();
  </script>
</body>
</html>
