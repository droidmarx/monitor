<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Operacional — Tempo Real</title>
  <meta name="theme-color" content="#020617" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060b16;
      --panel: #0c1424;
      --panel-2: #111b2e;
      --border: rgba(148, 163, 184, 0.14);
      --text: #e8eef7;
      --muted: #8b9bb4;
      --cyan: #22d3ee;
      --blue: #3b82f6;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --violet: #a78bfa;
      --rota: #fbbf24;
      --ok: #34d399;
      --fail: #f87171;
      --wait: #64748b;
      --radius: 14px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(34, 211, 238, 0.08), transparent 50%),
                  radial-gradient(900px 500px at 100% 0%, rgba(99, 102, 241, 0.07), transparent 45%),
                  var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }

    body.locked { overflow: auto; }

    /* Login */
    .gate {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
    }
    .gate.oculto { display: none; }
    .gate-card {
      width: min(400px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 24px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }
    .gate-card h1 {
      font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .gate-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .gate-card label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .gate-card input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
      font-size: 0.95rem; outline: none; margin-bottom: 14px;
    }
    .gate-card input:focus { border-color: rgba(34,211,238,0.45); }
    .gate-card button {
      width: 100%; padding: 13px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #041018; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    }
    .gate-erro { color: var(--red); font-size: 0.85rem; margin-top: 10px; display: none; }

    /* Shell */
    .shell {
      display: none;
      height: 100vh;
      grid-template-rows: auto auto 1fr auto;
      padding: 14px 18px 10px;
      gap: 12px;
    }
    body.unlocked .shell { display: grid; }
    body.unlocked .gate { display: none; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(12, 20, 36, 0.85);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 18px;
      backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, rgba(34,211,238,0.25), rgba(99,102,241,0.25));
      border: 1px solid rgba(34,211,238,0.3);
      display: grid; place-items: center; font-size: 1.1rem;
    }
    .brand h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
    .brand span { display: block; font-size: 0.75rem; color: var(--muted); font-weight: 500; }

    .kpis {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; flex: 1;
    }
    .kpi {
      min-width: 88px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
    }
    .kpi strong {
      display: block; font-family: var(--mono); font-size: 1.35rem; font-weight: 600; line-height: 1.1;
    }
    .kpi em { font-style: normal; font-size: 0.68rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .kpi.rota strong { color: var(--rota); }
    .kpi.ok strong { color: var(--ok); }
    .kpi.fail strong { color: var(--fail); }
    .kpi.wait strong { color: #94a3b8; }
    .kpi.total strong { color: var(--cyan); }

    .top-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .live-pill {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.28);
      color: var(--green);
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 7px 12px; border-radius: 999px;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    .live-pill.off {
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.28);
      color: var(--red);
    }
    .live-pill.off .live-dot { background: var(--red); animation: none; }

    .icon-btn {
      height: 36px; padding: 0 12px;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--panel-2); color: var(--text);
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .icon-btn:hover { border-color: rgba(34,211,238,0.35); }
    .icon-btn.muted-on { color: var(--red); border-color: rgba(248,113,113,0.35); }

    .clock {
      font-family: var(--mono); font-size: 1rem; font-weight: 600; color: var(--cyan);
      min-width: 72px; text-align: right;
    }

    /* Main grid */
    .board {
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 12px;
      align-content: start;
      padding-right: 4px;
      min-height: 0;
      height: 100%;
    }
    .board::-webkit-scrollbar { width: 8px; }
    .board::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.25); border-radius: 8px; }

    .tech-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex; flex-direction: column;
      min-height: 220px;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .tech-card.has-rota {
      border-color: rgba(251, 191, 36, 0.45);
      box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.12), 0 12px 32px rgba(251, 191, 36, 0.06);
    }
    .tech-card.flash-rota { animation: flashRota 1.1s ease; }
    .tech-card.flash-ok { animation: flashOk 1.1s ease; }
    .tech-card.flash-fail { animation: flashFail 1.1s ease; }
    @keyframes flashRota {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      30% { box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.55), 0 0 28px rgba(251, 191, 36, 0.25); }
    }
    @keyframes flashOk {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      30% { box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.55), 0 0 28px rgba(52, 211, 153, 0.25); }
    }
    @keyframes flashFail {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      30% { box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.55), 0 0 28px rgba(248, 113, 113, 0.25); }
    }

    .tech-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
      border-bottom: 1px solid var(--border);
    }
    .tech-name {
      font-size: 0.98rem; font-weight: 700; letter-spacing: -0.01em;
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .tech-name .avatar {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      background: rgba(167, 139, 250, 0.18); color: var(--violet);
      display: grid; place-items: center; font-size: 0.75rem; font-weight: 800;
    }
    .tech-badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .mini {
      font-size: 0.68rem; font-weight: 700; padding: 3px 7px; border-radius: 999px;
      font-family: var(--mono);
    }
    .mini.rota { background: rgba(251,191,36,0.15); color: var(--rota); }
    .mini.ok { background: rgba(52,211,153,0.15); color: var(--ok); }
    .mini.fail { background: rgba(248,113,113,0.15); color: var(--fail); }
    .mini.wait { background: rgba(100,116,139,0.18); color: #94a3b8; }

    .tech-body {
      padding: 10px 12px 12px;
      display: flex; flex-direction: column; gap: 8px;
      flex: 1; overflow: auto; max-height: 420px;
    }

    .os-row {
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 11px;
      background: rgba(0,0,0,0.18);
      border-left: 3px solid var(--wait);
      transition: background 0.2s, border-color 0.2s;
    }
    .os-row.rota { border-left-color: var(--rota); background: rgba(251,191,36,0.06); }
    .os-row.concluido { border-left-color: var(--ok); }
    .os-row.nao-concluido { border-left-color: var(--fail); }
    .os-row.novo {
      animation: rowIn 0.45s ease;
    }
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }

    .os-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    .os-status {
      font-size: 0.68rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .os-row.rota .os-status { color: var(--rota); }
    .os-row.concluido .os-status { color: var(--ok); }
    .os-row.nao-concluido .os-status { color: var(--fail); }
    .os-row.aguardando .os-status { color: #94a3b8; }
    .os-time {
      font-family: var(--mono); font-size: 0.72rem; color: var(--muted); font-weight: 600;
    }
    .os-client {
      font-size: 0.9rem; font-weight: 700; line-height: 1.25; margin-bottom: 2px;
    }
    .os-meta {
      font-size: 0.75rem; color: var(--muted); line-height: 1.35;
    }
    .os-obs {
      margin-top: 6px; font-size: 0.75rem; color: #fca5a5; font-style: italic;
      background: rgba(248,113,113,0.06); border-radius: 6px; padding: 5px 8px;
    }
    .os-obs.ok-obs { color: #6ee7b7; background: rgba(52,211,153,0.06); }

    .empty-tech {
      color: var(--muted); font-size: 0.85rem; text-align: center; padding: 28px 12px; font-style: italic;
    }

    /* Footer */
    .footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      font-size: 0.75rem; color: var(--muted); padding: 2px 4px;
    }
    .feed {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-width: 0; flex: 1;
    }
    .feed-item {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.72rem;
      color: var(--text);
      white-space: nowrap;
      max-width: 420px;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: rowIn 0.35s ease;
    }
    .feed-item.rota { border-color: rgba(251,191,36,0.35); color: var(--rota); }
    .feed-item.ok { border-color: rgba(52,211,153,0.35); color: var(--ok); }
    .feed-item.fail { border-color: rgba(248,113,113,0.35); color: var(--fail); }

    .toast-stack {
      position: fixed; top: 18px; right: 18px; z-index: 50;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      background: rgba(12, 20, 36, 0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 260px; max-width: 380px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.4);
      animation: toastIn 0.35s ease;
      pointer-events: auto;
    }
    .toast.rota { border-left: 3px solid var(--rota); }
    .toast.ok { border-left: 3px solid var(--ok); }
    .toast.fail { border-left: 3px solid var(--fail); }
    .toast strong { display: block; font-size: 0.85rem; margin-bottom: 2px; }
    .toast span { font-size: 0.78rem; color: var(--muted); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: none; }
    }

    .loading-line {
      height: 2px; width: 100%; background: transparent; overflow: hidden; border-radius: 2px;
    }
    .loading-line.active::after {
      content: ""; display: block; height: 100%; width: 30%;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: scan 1.2s linear infinite;
    }
    @keyframes scan {
      from { transform: translateX(-100%); }
      to { transform: translateX(400%); }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .shell { height: auto; min-height: 100vh; overflow: visible; }
      .board { grid-template-columns: 1fr; max-height: none; }
      .kpis { display: none; }
    }
  </style>
</head>
<body class="locked">

  <div class="gate" id="gate">
    <div class="gate-card">
      <h1>Monitor Operacional</h1>
      <p>Acesso restrito à equipe. Use as credenciais de admin ou master.</p>
      <label for="gateUser">Usuário</label>
      <input id="gateUser" type="text" autocomplete="username" placeholder="admin ou master" />
      <label for="gatePass">Senha</label>
      <input id="gatePass" type="password" autocomplete="current-password" placeholder="Senha" onkeydown="if(event.key==='Enter')entrarGate()" />
      <button type="button" onclick="entrarGate()">Entrar no monitor</button>
      <div class="gate-erro" id="gateErro">Credenciais inválidas.</div>
    </div>
  </div>

  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">📡</div>
        <div>
          <h1>Monitor Operacional</h1>
          <span id="subBrand">Sincronizando técnicos…</span>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi total"><strong id="kpiTotal">0</strong><em>O.S. total</em></div>
        <div class="kpi rota"><strong id="kpiRota">0</strong><em>Em rota</em></div>
        <div class="kpi ok"><strong id="kpiOk">0</strong><em>Concluídas</em></div>
        <div class="kpi fail"><strong id="kpiFail">0</strong><em>Não concl.</em></div>
        <div class="kpi wait"><strong id="kpiWait">0</strong><em>Pendentes</em></div>
      </div>

      <div class="top-actions">
        <div class="live-pill" id="livePill"><span class="live-dot"></span> Ao vivo</div>
        <button class="icon-btn" id="btnSom" onclick="toggleSom()" title="Ativar/desativar sons">🔊 Sons</button>
        <button class="icon-btn" onclick="forcarSync()" title="Atualizar agora">↻ Sync</button>
        <div class="clock" id="relogio">--:--</div>
      </div>
    </header>

    <div class="loading-line" id="loadingLine"></div>
    <main class="board" id="board"></main>

    <footer class="footer">
      <div class="feed" id="feed"></div>
      <div id="footerMeta">Poll 6s · API Mock</div>
    </footer>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script>
    const API_URL = "https://68f458d8b16eb6f46834542c.mockapi.io/Rexord/Galeria";
    const MASTER_LOGIN = "master";
    const MASTER_SENHA = "master123";
    const ADMIN_LOGIN = "admin";
    const ADMIN_SENHA = "mike";
    const POLL_MS = 6000;

    let somAtivo = true;
    let audioCtx = null;
    let snapshotAnterior = {}; // chave: tecnico|osId -> status
    let primeiroSync = true;
    let pollTimer = null;
    let feedItens = [];

    function entrarGate() {
      const u = (document.getElementById("gateUser").value || "").trim().toLowerCase();
      const p = document.getElementById("gatePass").value || "";
      const ok =
        (u === MASTER_LOGIN && p === MASTER_SENHA) ||
        (u === ADMIN_LOGIN && p === ADMIN_SENHA);
      if (!ok) {
        document.getElementById("gateErro").style.display = "block";
        return;
      }
      sessionStorage.setItem("monitor_auth", "1");
      liberarMonitor();
    }

    function liberarMonitor() {
      document.body.classList.remove("locked");
      document.body.classList.add("unlocked");
      document.getElementById("gate").classList.add("oculto");
      document.getElementById("board").innerHTML =
        '<div class="empty-tech" style="grid-column:1/-1;padding:48px;">Carregando dados da operação…</div>';
      garantirAudio();
      atualizarRelogio();
      setInterval(atualizarRelogio, 1000);
      sync();
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(sync, POLL_MS);
    }

    function atualizarRelogio() {
      document.getElementById("relogio").textContent = new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit", minute: "2-digit", second: "2-digit"
      });
    }

    function garantirAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
      } catch (e) {}
    }

    function toggleSom() {
      somAtivo = !somAtivo;
      const btn = document.getElementById("btnSom");
      btn.textContent = somAtivo ? "🔊 Sons" : "🔇 Mudo";
      btn.classList.toggle("muted-on", !somAtivo);
      if (somAtivo) {
        garantirAudio();
        tocarBeep("ok");
      }
    }

    function tocarBeep(tipo) {
      if (!somAtivo) return;
      try {
        garantirAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (tipo === "rota") {
          osc.type = "triangle";
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(780, now + 0.12);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          osc.start(now); osc.stop(now + 0.3);
        } else if (tipo === "ok") {
          osc.type = "sine";
          osc.frequency.setValueAtTime(660, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
          osc.start(now); osc.stop(now + 0.36);
        } else if (tipo === "fail") {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(140, now + 0.25);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
          osc.start(now); osc.stop(now + 0.42);
        } else {
          osc.type = "sine";
          osc.frequency.value = 440;
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.1, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
          osc.start(now); osc.stop(now + 0.16);
        }
      } catch (e) {}
    }

    function parsearAgenda(texto) {
      if (!texto || !String(texto).trim()) return [];
      const raw = String(texto);

      const temId = /\bID\s*:\s*\d+/i.test(raw);
      const temOS = /\bOS\s*:\s*\d+/i.test(raw);

      if (!temId && temOS) {
        const marcador = /OS\s*:\s*(\d+)/gi;
        const posicoes = [];
        let m;
        while ((m = marcador.exec(raw)) !== null) {
          posicoes.push({ id: m[1], inicio: m.index, fimMarcador: m.index + m[0].length });
        }
        return posicoes.map((atual, i) => {
          const proximo = posicoes[i + 1];
          const fimBloco = proximo ? proximo.inicio : raw.length;
          const corpo = raw.slice(atual.fimMarcador, fimBloco);
          const inicioTrecho = i === 0 ? 0 : posicoes[i - 1].fimMarcador;
          const trechoAntes = raw.slice(inicioTrecho, atual.inicio);
          const hm = trechoAntes.match(/(\d{1,2}h\d{2})\s*(?:às|as|-|até)\s*(\d{1,2}h\d{2})/i);
          const horario = hm ? `${hm[1].replace("h", ":")} - ${hm[2].replace("h", ":")}` : "";
          return {
            id: atual.id,
            cliente: (corpo.match(/Cliente:\s*(.*)/i) || [])[1]?.trim() || "Cliente não informado",
            horario,
            endereco: (corpo.match(/(?:📍\s*)?Endereço:\s*(.*)/i) || [])[1]?.trim() || "",
            assunto: (corpo.match(/Serviço:\s*(.*)/i) || [])[1]?.trim() || "Sem assunto"
          };
        });
      }

      // Formato padrão "ID: 12345"
      const blocos = raw.split(/\bID\s*:\s*/i).slice(1);
      return blocos.map(bloco => {
        const id = (bloco.match(/^(\d+)/) || [])[1] || "Sem ID";
        return {
          id: String(id).trim(),
          cliente: (bloco.match(/Cliente:\s*(.*)/i) || [])[1]?.trim() || "Cliente não informado",
          horario: (bloco.match(/Horário:\s*(.*)/i) || [])[1]?.trim() || "",
          endereco: (bloco.match(/Endereço:\s*(.*)/i) || [])[1]?.trim() || "",
          assunto: (bloco.match(/Assunto:\s*(.*)/i) || [])[1]?.trim() || "Sem assunto"
        };
      }).filter(os => os.id && os.id !== "Sem ID");
    }

    function normalizarStatus(info) {
      if (!info) return { status: "", obs: "", timestamp: "" };
      if (typeof info === "object") {
        return {
          status: info.status || "",
          obs: info.obs || "",
          timestamp: info.timestamp || "",
          data: info.data || ""
        };
      }
      return { status: info, obs: "", timestamp: "" };
    }

    function labelStatus(st) {
      if (st === "rota") return "Em rota";
      if (st === "concluido") return "Concluído";
      if (st === "nao-concluido") return "Não concluído";
      return "Pendente";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function pushFeed(texto, tipo) {
      feedItens.unshift({ texto, tipo, t: Date.now() });
      feedItens = feedItens.slice(0, 6);
      const el = document.getElementById("feed");
      el.innerHTML = feedItens.map(f =>
        `<span class="feed-item ${f.tipo === "rota" ? "rota" : f.tipo === "concluido" ? "ok" : f.tipo === "nao-concluido" ? "fail" : ""}">${escapeHtml(f.texto)}</span>`
      ).join("");
    }

    function showToast(titulo, detalhe, tipo) {
      const stack = document.getElementById("toastStack");
      const div = document.createElement("div");
      const cls = tipo === "rota" ? "rota" : tipo === "concluido" ? "ok" : tipo === "nao-concluido" ? "fail" : "";
      div.className = `toast ${cls}`;
      div.innerHTML = `<strong>${escapeHtml(titulo)}</strong><span>${escapeHtml(detalhe)}</span>`;
      stack.appendChild(div);
      setTimeout(() => div.remove(), 4500);
    }

    function forcarSync() { sync(); }

    async function sync() {
      const line = document.getElementById("loadingLine");
      const board = document.getElementById("board");
      line.classList.add("active");
      try {
        const resp = await fetch(API_URL + "?t=" + Date.now(), {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          headers: { "Accept": "application/json" }
        });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        const dados = await resp.json();
        if (!Array.isArray(dados)) throw new Error("Resposta da API inválida");
        if (!dados.length) {
          board.innerHTML = '<div class="empty-tech" style="grid-column:1/-1;padding:48px;">API respondeu sem técnicos cadastrados.</div>';
        } else {
          processarDados(dados);
        }
        document.getElementById("livePill").classList.remove("off");
        document.getElementById("livePill").innerHTML = '<span class="live-dot"></span> Ao vivo';
        document.getElementById("footerMeta").textContent =
          `Última sync ${new Date().toLocaleTimeString("pt-BR")} · ${dados.length} registro(s) · poll ${POLL_MS / 1000}s`;
      } catch (e) {
        console.error("Falha ao sincronizar:", e);
        document.getElementById("livePill").classList.add("off");
        document.getElementById("livePill").innerHTML = '<span class="live-dot"></span> Offline';
        document.getElementById("footerMeta").textContent = "Erro de conexão com a API";
        if (primeiroSync || !board.querySelector(".tech-card")) {
          board.innerHTML = `
            <div class="empty-tech" style="grid-column:1/-1;padding:48px;max-width:560px;margin:40px auto;text-align:left;font-style:normal;">
              <div style="font-size:1.1rem;font-weight:700;color:#f87171;margin-bottom:10px;">Não foi possível carregar os dados</div>
              <div style="color:#94a3b8;line-height:1.5;margin-bottom:12px;">${escapeHtml(String(e.message || e))}</div>
              <div style="color:#64748b;font-size:0.85rem;line-height:1.45;">
                Verifique a internet e se a página não está bloqueando requisições externas.
                Se abriu o arquivo direto do disco (file://), use um servidor local ou hospede o HTML.
                Clique em <strong style="color:#e2e8f0;">Sync</strong> para tentar de novo.
              </div>
            </div>`;
        }
      } finally {
        line.classList.remove("active");
      }
    }

    function processarDados(dados) {
      const tecnicos = dados
        .map(d => d.tecnico)
        .filter(Boolean)
        .filter((v, i, a) => a.indexOf(v) === i)
        .sort((a, b) => a.localeCompare(b, "pt-BR"));

      document.getElementById("subBrand").textContent =
        `${tecnicos.length} técnico${tecnicos.length === 1 ? "" : "s"} em campo · monitoramento desktop`;

      let total = 0, rota = 0, ok = 0, fail = 0, wait = 0;
      const mudancas = [];
      const novoSnapshot = {};
      const boardHtml = [];

      tecnicos.forEach(tec => {
        const registro = dados.find(d => d.tecnico === tec) || {};
        const listaOS = parsearAgenda(registro.agenda || "");
        let statusMap = {};
        try { statusMap = JSON.parse(registro.status || "{}"); } catch (e) {}

        let cRota = 0, cOk = 0, cFail = 0, cWait = 0;
        const rows = [];

        listaOS.forEach(os => {
          const info = normalizarStatus(statusMap[os.id]);
          let st = info.status;
          if (st !== "rota" && st !== "concluido" && st !== "nao-concluido") st = "aguardando";

          const chave = `${tec}|${os.id}`;
          novoSnapshot[chave] = st;
          const anterior = snapshotAnterior[chave];
          if (!primeiroSync && anterior !== undefined && anterior !== st) {
            mudancas.push({ tec, os, de: anterior, para: st, info });
          }

          if (st === "rota") cRota++;
          else if (st === "concluido") cOk++;
          else if (st === "nao-concluido") cFail++;
          else cWait++;

          const hora = info.timestamp && info.timestamp !== "--:--"
            ? (String(info.timestamp).match(/\d{1,2}:\d{2}/)?.[0] || info.timestamp)
            : "";
          const obsHtml = info.obs
            ? `<div class="os-obs ${st === "concluido" ? "ok-obs" : ""}">${escapeHtml(info.obs)}</div>`
            : "";

          rows.push(`
            <div class="os-row ${st}" data-key="${escapeHtml(chave)}">
              <div class="os-top">
                <span class="os-status">${labelStatus(st)}</span>
                <span class="os-time">${hora ? hora : (os.horario ? escapeHtml(os.horario) : "—")}</span>
              </div>
              <div class="os-client">${escapeHtml(os.cliente)}</div>
              <div class="os-meta">OS ${escapeHtml(os.id)} · ${escapeHtml(os.assunto)}${os.endereco ? " · " + escapeHtml(os.endereco.replace(/\s+/g, " ").slice(0, 60)) : ""}</div>
              ${obsHtml}
            </div>
          `);
        });

        total += listaOS.length;
        rota += cRota; ok += cOk; fail += cFail; wait += cWait;

        const badges = [];
        if (cRota) badges.push(`<span class="mini rota">${cRota} rota</span>`);
        if (cOk) badges.push(`<span class="mini ok">${cOk} ok</span>`);
        if (cFail) badges.push(`<span class="mini fail">${cFail} falha</span>`);
        if (cWait) badges.push(`<span class="mini wait">${cWait} pend.</span>`);

        boardHtml.push(`
          <article class="tech-card ${cRota ? "has-rota" : ""}" id="card-${escapeHtml(tec).replace(/[^a-zA-Z0-9_-]/g, "_")}" data-tec="${escapeHtml(tec)}">
            <div class="tech-head">
              <div class="tech-name">
                <span class="avatar">${escapeHtml((tec || "?").charAt(0).toUpperCase())}</span>
                <span>${escapeHtml(tec)}</span>
              </div>
              <div class="tech-badges">${badges.join("") || '<span class="mini wait">sem O.S.</span>'}</div>
            </div>
            <div class="tech-body">
              ${rows.length ? rows.join("") : '<div class="empty-tech">Nenhuma O.S. na agenda</div>'}
            </div>
          </article>
        `);
      });

      document.getElementById("kpiTotal").textContent = total;
      document.getElementById("kpiRota").textContent = rota;
      document.getElementById("kpiOk").textContent = ok;
      document.getElementById("kpiFail").textContent = fail;
      document.getElementById("kpiWait").textContent = wait;

      const board = document.getElementById("board");
      if (!tecnicos.length) {
        board.innerHTML = `<div class="empty-tech" style="grid-column:1/-1;padding:60px;">Nenhum técnico cadastrado na API.</div>`;
      } else {
        board.innerHTML = boardHtml.join("");
      }

      // Alertas de mudanças
      mudancas.forEach(m => {
        const tipoSom = m.para === "rota" ? "rota" : m.para === "concluido" ? "ok" : m.para === "nao-concluido" ? "fail" : "ok";
        tocarBeep(tipoSom);
        const msg = `${m.tec}: ${labelStatus(m.para)} — ${m.os.cliente}`;
        pushFeed(msg, m.para);
        showToast(
          `${labelStatus(m.para)} · ${m.tec}`,
          `OS ${m.os.id} · ${m.os.cliente} · ${m.os.assunto || ""}`,
          m.para
        );
        const cardId = "card-" + m.tec.replace(/[^a-zA-Z0-9_-]/g, "_");
        const card = document.getElementById(cardId);
        if (card) {
          const flash = m.para === "rota" ? "flash-rota" : m.para === "concluido" ? "flash-ok" : "flash-fail";
          card.classList.add(flash);
          setTimeout(() => card.classList.remove(flash), 1200);
        }
      });

      snapshotAnterior = novoSnapshot;
      primeiroSync = false;
    }

    // Auto-login se já autenticado na sessão
    window.addEventListener("load", () => {
      if (sessionStorage.getItem("monitor_auth") === "1") {
        liberarMonitor();
      } else {
        document.getElementById("gateUser").focus();
      }
    });
  </script>
</body>
